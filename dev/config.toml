# Local development config (R1S). Paths are relative to the repo root;
# run from there: cargo run -p telemetryd -- --config dev/config.toml
vin = "DEV0000001"
model = "R1S"
catalog_path = "catalogs/r1s.json"
# Temporary until the cloud rule sync (M5): unsigned local rule set.
rules_file = "rulesets/default.json"

[ingest]
udp_bind = "127.0.0.1:5005"

[output]
log_dir = "dev/state/out"
max_file_bytes = 10485760
max_files = 5
