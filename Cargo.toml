[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/rules",
    "crates/telemetryd",
    "crates/simulator",
    "crates/cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Direct dependencies are pinned exactly (see docs/DECISIONS.md D-002).
[workspace.dependencies]
protocol = { path = "crates/protocol" }
rules = { path = "crates/rules" }

anyhow = "=1.0.104"
cel = { version = "=0.14.5", default-features = false }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
toml = "=1.1.6"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

proptest = "=1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
